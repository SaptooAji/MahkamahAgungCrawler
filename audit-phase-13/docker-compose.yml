version: '3.8'

services:

  # ============================================================
  # 1. PostgreSQL
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: ma_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ma_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ma_rahasia_123}
      POSTGRES_DB: ${POSTGRES_DB:-ma_database}

    ports:
      - "15432:5432"

    volumes:
      # Persistensi database
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ma_admin} -d ${POSTGRES_DB:-ma_database}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        limits:
          memory: 1G


  # ============================================================
  # 2. Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ma_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      # Persistensi Redis
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    deploy:
      resources:
        limits:
          memory: 512M


  # ============================================================
  # 3. pgAdmin 4
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ma_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ma.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123456}

    ports:
      # Browser:
      # http://localhost:5050
      - "5050:80"

    volumes:
      # Menyimpan konfigurasi pgAdmin
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 512M


  # ============================================================
  # 4. RedisInsight
  # ============================================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: ma_redisinsight
    restart: unless-stopped

    ports:
      # Browser:
      # http://localhost:5540
      - "5540:5540"

    volumes:
      # Menyimpan konfigurasi RedisInsight
      - redisinsight_data:/data

    depends_on:
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 512M


# ============================================================
# Named Volumes
# ============================================================
volumes:

  # PostgreSQL database
  postgres_data:

  # Redis AOF data
  redis_data:

  # pgAdmin configuration
  pgadmin_data:

  # RedisInsight configuration
  redisinsight_data: