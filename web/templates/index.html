<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA Crawler Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-8 border border-gray-100">
        
        <!-- Header -->
        <div class="mb-8 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">Direktori Putusan Crawler</h1>
            <p class="text-gray-500 text-sm mt-1">Sistem ekstraksi metadata otomatis (In-Memory Pipeline)</p>
        </div>

        <!-- Control Panel -->
        <div class="flex gap-4 mb-8">
            <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Putusan</label>
                <input type="number" id="tahunInput" value="2021" 
                       class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="flex items-end">
                <button id="btnStart" onclick="startScraping()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition duration-200 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                    </svg>
                    Mulai Ekstraksi
                </button>
            </div>
        </div>

        <!-- Progress Monitor (Hidden by default) -->
        <div id="progressMonitor" class="hidden bg-gray-50 rounded-lg p-6 border border-gray-200">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-gray-700">Status: <span id="statusText" class="text-blue-600">Menyiapkan Browser...</span></span>
                <span id="percentageText" class="text-sm font-bold text-gray-900">0%</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-3 mb-4 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-4 mt-4">
                <div class="bg-white p-3 rounded border">
                    <p class="text-xs text-gray-500 mb-1">Halaman Diproses</p>
                    <p id="pagesText" class="text-lg font-semibold text-gray-800">0 / 0</p>
                </div>
                <div class="bg-white p-3 rounded border">
                    <p class="text-xs text-gray-500 mb-1">Estimasi Selesai (ETA)</p>
                    <p id="etaText" class="text-lg font-semibold text-orange-600">Menghitung...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentJobId = null;
        let pollInterval = null;

        async function startScraping() {
            const tahun = document.getElementById('tahunInput').value;
            const btn = document.getElementById('btnStart');
            
            // UI State Update
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('progressMonitor').classList.remove('hidden');
            document.getElementById('statusText').innerText = "Mengirim tugas ke Celery...";

            try {
                // Trigger API FastAPI
                const response = await fetch(`/api/start-scraping?tahun=${tahun}`, { method: 'POST' });
                const data = await response.json();
                
                currentJobId = data.job_id;
                
                // Mulai polling status setiap 2 detik
                pollInterval = setInterval(checkStatus, 2000);
                
            } catch (error) {
                alert("Gagal menghubungi server FastAPI.");
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        async function checkStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`/api/job-status/${currentJobId}`);
                const data = await response.json();

                if (data.status === "Menghitung ETA...") {
                    document.getElementById('statusText').innerText = "Sedang Berjalan (Menghitung ETA)...";
                    return;
                }

                // Update DOM elements
                document.getElementById('statusText').innerText = "Mengekstrak Data";
                document.getElementById('progressBar').style.width = `${data.progress_persen}%`;
                document.getElementById('percentageText').innerText = `${data.progress_persen}%`;
                document.getElementById('pagesText').innerText = data.halaman_selesai;
                document.getElementById('etaText').innerText = data.eta_text;

                // Hentikan polling jika sudah 100%
                if (data.progress_persen >= 100) {
                    clearInterval(pollInterval);
                    document.getElementById('statusText').innerText = "Selesai";
                    document.getElementById('statusText').classList.replace('text-blue-600', 'text-green-600');
                    document.getElementById('progressBar').classList.replace('bg-blue-600', 'bg-green-500');
                    document.getElementById('etaText').innerText = "Tugas Selesai";
                }

            } catch (error) {
                console.error("Gagal mengambil status:", error);
            }
        }
    </script>
</body>
</html>
